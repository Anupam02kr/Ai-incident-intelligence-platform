apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-frontend
  namespace: incident-intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incident-frontend
  template:
    metadata:
      labels:
        app: incident-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/incident-intelligence-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: incident-frontend
  namespace: incident-intelligence
spec:
  type: LoadBalancer
  selector:
    app: incident-frontend
  ports:
    - port: 80
      targetPort: 80
